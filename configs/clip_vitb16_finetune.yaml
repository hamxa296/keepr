# E1 large baseline, full fine-tune (plan amendment A1). Only if there is spare 4090 time.
run_name: YYYYMMDD_clipb16ft_s0
seed: 0

data:
  pairs_csv: data/processed/pairs.csv
  image_root: data/raw/phototriage
  image_size: 224

model:
  backbone: clip_vit_b16
  pretrained: openai
  frozen: false

train:
  epochs: 10
  batch_size: 32
  optimizer: adamw
  lr: 1.0e-5                    # low LR for a full CLIP fine-tune
  weight_decay: 5.0e-2
  precision: bf16

eval:
  test_agreement_threshold: 0.7
  ece_bins: 15
