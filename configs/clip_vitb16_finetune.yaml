# E1 large baseline, full fine-tune (roadmap v1.1, E1). Only if there is spare GPU time.
# On a 16 GB Kaggle T4: fp16 (T4 has no bf16) with batch 16, or enable gradient checkpointing.
run_name: YYYYMMDD_clipb16ft_s0
seed: 0

data:
  pairs_csv: data/processed/pairs.csv
  image_root: data/raw/phototriage-256   # on Kaggle: /kaggle/input/phototriage-256
  image_size: 224

model:
  backbone: clip_vit_b16
  pretrained: openai
  frozen: false

train:
  epochs: 10
  batch_size: 16
  optimizer: adamw
  lr: 1.0e-5                    # low LR for a full CLIP fine-tune
  weight_decay: 5.0e-2
  precision: fp16

eval:
  test_agreement_threshold: 0.7
  ece_bins: 15
